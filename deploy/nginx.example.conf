# Optional nginx reverse proxy for a public server.
# 1. Point DNS to the host
# 2. sudo cp deploy/nginx.example.conf /etc/nginx/sites-available/valorant-bot
# 3. Adjust server_name + TLS, then enable the site
# 4. Set AUTH_BASE_URL=https://bot.example.com in /etc/valorant-bot/env

upstream valorant_bot_auth {
    server 127.0.0.1:8787;
    keepalive 8;
}

# Preserve WebSocket upgrades for the remote CAPTCHA viewer.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name bot.example.com;

    # Redirect HTTP → HTTPS once certs exist (certbot).
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://valorant_bot_auth;
        proxy_http_version 1.1;
        # Keep the exact configured public Host, including a non-default port.
        # The application validates AUTH_BASE_URL directly; it does not select
        # its origin from X-Forwarded-* headers.
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

